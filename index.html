 return `<div class="wrap" style="max-width:760px"><h1 style="font-size:28px;margin-bottom:12px">${q?"Track order":"My orders"}</h1><div class="box row" data-enter style="margin-bottom:14px"><div class="chk" style="max-width:none;flex:1;flex-wrap:wrap"><input id="ti" placeholder="Order ID, for example SP100001" aria-label="Order ID"><input id="tn" placeholder="Mobile number" aria-label="Mobile number" inputmode="numeric"></div><button type="button" class="b1" onclick="go('#/track?id='+encodeURIComponent($('#ti').value)+'&m='+encodeURIComponent($('#tn').value))">Track order</button></div>${q?r:(D.orders.map(oc).join("")||'<div class="empty">No orders yet.</div>')}</div>`}
function wishV(){const L=D.wish.map(by).filter(Boolean);return `<div class="wrap"><h1 style="font-size:28px;margin-bottom:12px">Wishlist</h1>${L.length?`<div class="grid">${L.map(card).join("")}</div>`:'<div class="empty">Tap the heart on a product to save it here.</div>'}</div>`}
function page(k){const p=PG[k];if(!p)return '<div class="wrap empty">Page not found. <a href="#/">Go home</a></div>';return `<div class="wrap" style="max-width:720px"><h1 style="margin-bottom:12px">${p[0]}</h1><p>${p[1]}</p><p class="mut">Draft text, to be confirmed by the store owner.</p></div>`}
function nav(){$("#cn").innerHTML='<a href="#/shop"><b>☰ All</b></a>'+CO().map(c=>`<a href="#/shop?cat=${encodeURIComponent(c)}">${c}</a>`).join("")+'<a href="#/shop?tag=offer">Offers</a><a href="#/bulk">Bulk orders</a>';
$("#sg").innerHTML=P.map(p=>`<option value="${p.name}">`).join("");
$("#ft").innerHTML=`<div class="fi"><div><h4>Malnad Sports</h4><span style="opacity:.8">Gear up. Play hard. Delivered from Shivamogga.</span><div class="so"><a href="#" aria-label="Facebook">f</a><a href="#" aria-label="Instagram">IG</a><a href="#" aria-label="YouTube">YT</a><a href="#" aria-label="WhatsApp">WA</a></div></div><div><h4>Shop</h4><a href="#/shop">All products</a><a href="#/shop?tag=new">New arrivals</a><a href="#/shop?tag=best">Best sellers</a><a href="#/shop?tag=offer">Deals</a></div><div><h4>Help</h4><a href="#/track">Track order</a><a href="#/page/shipping">Shipping and delivery</a><a href="#/page/cancellation">Cancellation</a></div><div><h4>About</h4><a href="#/page/about">Our story</a><a href="#/page/contact">Contact us</a><a href="#/page/terms">Terms and conditions</a><a href="#/page/privacy">Privacy policy</a><a href="#/admin">Admin login</a></div></div><div class="cp">© 2026 Malnad Sports. All rights reserved.</div>`}

<!-- ══ VOICE MODAL ══════════════════════════════════════════════════════ -->
<div id="voice-modal" role="dialog" aria-modal="true" aria-label="Voice search">
  <div class="vm-box">
    <h3 id="vm-title">Listening…</h3>
    <div class="mic-ring" id="vm-ring">
      <svg viewBox="0 0 24 24" width="40" height="40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="9" y="2" width="6" height="12" rx="3" fill="#fff"/>
        <path d="M5 10a7 7 0 0 0 14 0" stroke="#fff" stroke-width="2.2" stroke-linecap="round" fill="none"/>
        <line x1="12" y1="17" x2="12" y2="22" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
        <line x1="8.5" y1="22" x2="15.5" y2="22" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
      </svg>
    </div>
    <p id="vm-txt">Say a product name, e.g. &ldquo;cricket bat&rdquo;</p>
    <button class="vm-cancel" onclick="closeVoice()">Cancel</button>
  </div>
</div>

<!-- ══ CAMERA MODAL ══════════════════════════════════════════════════════ -->
<div id="cam-modal" role="dialog" aria-modal="true" aria-label="Image search">
  <video id="cam-video" autoplay playsinline muted></video>
  <canvas id="cam-canvas"></canvas>

  <div class="cam-ui">
    <!-- top bar -->
    <div class="cam-topbar">
      <button class="cam-icon-btn" onclick="closeCamera()" aria-label="Close">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
      <span class="cam-topbar-title">Search by image</span>
      <button class="cam-icon-btn" id="flip-btn" onclick="flipCamera()" aria-label="Flip camera">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 4v6h6M23 20v-6h-6"/><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4-4.64 4.36A9 9 0 0 1 3.51 15"/></svg>
      </button>
    </div>

    <!-- viewfinder -->
    <div class="cam-viewfinder">
      <div class="cam-frame">
        <span class="cr1"></span>
        <span class="cr2"></span>
      </div>
      <p class="cam-hint">Point at a sports product and tap capture</p>
    </div>

    <!-- shutter -->
    <div class="cam-bottom">
      <div style="width:52px"></div>
      <button class="cam-snap-btn" onclick="snapPhoto()" aria-label="Take photo">
        <svg viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
      </button>
      <div style="width:52px"></div>
    </div>

    <!-- result overlay -->
    <div class="cam-result-panel" id="cam-result">
      <img id="cam-preview" src="" alt="Captured photo">
      <h3>Select a sport category</h3>
      <div class="cam-pills" id="cam-pill-row"></div>
      <button class="cam-retake-btn" onclick="retakePhoto()">&#8634;&nbsp; Retake photo</button>
    </div>
  </div>
</div>

<script>
/* ================================================================
   VOICE SEARCH  — Web Speech API (Chrome, Edge, Samsung Browser)
================================================================ */
var _rec = null;
var _SR  = window.SpeechRecognition || window.webkitSpeechRecognition;

function openVoice() {
  if (!_SR) {
    alert('Voice search works in Chrome or Edge. Please open this page in Chrome.');
    return;
  }
  var modal = document.getElementById('voice-modal');
  var ring  = document.getElementById('vm-ring');
  var title = document.getElementById('vm-title');
  var txt   = document.getElementById('vm-txt');

  ring.className  = 'mic-ring';
  title.textContent = 'Listening\u2026';
  txt.textContent   = 'Say a product name, e.g. \u201ccricket bat\u201d';
  modal.classList.add('open');
  document.getElementById('mic-btn').classList.add('listening');

  _rec = new _SR();
  _rec.lang           = 'en-IN';
  _rec.interimResults = true;
  _rec.continuous     = false;
  _rec.maxAlternatives = 3;

  _rec.onresult = function(e) {
    var interim = '', final_ = '';
    for (var i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) final_ += e.results[i][0].transcript;
      else interim += e.results[i][0].transcript;
    }
    txt.textContent = (final_ || interim || '').trim() || '\u2026';
    if (final_ && final_.trim()) {
      title.textContent = 'Got it!';
      ring.className = 'mic-ring done';
      var q = final_.trim();
      setTimeout(function() {
        closeVoice();
        document.getElementById('q').value = q;
        srch();
      }, 650);
    }
  };

  _rec.onspeechend = function() { try { _rec.stop(); } catch(e) {} };

  _rec.onerror = function(e) {
    var msgs = {
      'not-allowed'  : 'Microphone access denied. Allow mic in browser settings.',
      'no-speech'    : 'No speech detected \u2014 try again.',
      'network'      : 'Network error. Check your connection.',
      'audio-capture': 'No microphone found on this device.'
    };
    title.textContent = 'Could not hear you';
    txt.textContent   = msgs[e.error] || ('Error: ' + e.error);
    ring.className = 'mic-ring done';
    document.getElementById('mic-btn').classList.remove('listening');
  };

  _rec.onend = function() {
    document.getElementById('mic-btn').classList.remove('listening');
  };

  try { _rec.start(); } catch(err) {
    title.textContent = 'Cannot start mic';
    txt.textContent = err.message;
  }
}

function closeVoice() {
  document.getElementById('voice-modal').classList.remove('open');
  document.getElementById('mic-btn').classList.remove('listening');
  if (_rec) { try { _rec.abort(); } catch(e) {} _rec = null; }
}

document.getElementById('voice-modal').addEventListener('click', function(e) {
  if (e.target === this) closeVoice();
});


/* ================================================================
   CAMERA SEARCH  — getUserMedia → live viewfinder → snap → picker
================================================================ */
var _stream     = null;
var _facing     = 'environment';   // start rear camera

async function openCamera() {
  document.getElementById('cam-result').classList.remove('show');
  document.getElementById('cam-modal').classList.add('open');
  document.getElementById('cam-btn').classList.add('capturing');
  await _startCam();
}

async function _startCam() {
  if (_stream) { _stream.getTracks().forEach(function(t){t.stop();}); _stream = null; }
  var video = document.getElementById('cam-video');
  try {
    _stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: _facing }, width:{ideal:1280}, height:{ideal:960} },
      audio: false
    });
    video.srcObject = _stream;
  } catch(err) {
    closeCamera();
    var msgs = {
      NotAllowedError  : 'Camera access denied. Allow camera in browser settings and reload.',
      NotFoundError    : 'No camera found on this device.',
      NotReadableError : 'Camera is in use by another app.'
    };
    alert(msgs[err.name] || ('Camera error: ' + err.message));
  }
}

function flipCamera() {
  _facing = (_facing === 'environment') ? 'user' : 'environment';
  _startCam();
}

function snapPhoto() {
  var video   = document.getElementById('cam-video');
  var canvas  = document.getElementById('cam-canvas');
  var preview = document.getElementById('cam-preview');
  var result  = document.getElementById('cam-result');
  var pills   = document.getElementById('cam-pill-row');

  canvas.width  = video.videoWidth  || 640;
  canvas.height = video.videoHeight || 480;
  canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
  preview.src = canvas.toDataURL('image/jpeg', 0.88);

  // stop stream
  if (_stream) { _stream.getTracks().forEach(function(t){t.stop();}); _stream = null; }
  video.srcObject = null;

  // build sport pills
  var SPORTS = ['Cricket','Football','Volleyball','Throwball','Tennis','Badminton','Dumbbells','Gym Items','Kids Sports','Shoes','Socks','Sports Bags','Table Tennis','Basketball','Fitness','Boxing'];
  pills.innerHTML = '';
  SPORTS.forEach(function(s) {
    var b = document.createElement('button');
    b.className   = 'cam-pill';
    b.textContent = s;
    b.onclick = function() {
      closeCamera();
      go('#/shop?cat=' + encodeURIComponent(s));
    };
    pills.appendChild(b);
  });

  result.classList.add('show');
}

function retakePhoto() {
  document.getElementById('cam-result').classList.remove('show');
  _startCam();
}

function closeCamera() {
  document.getElementById('cam-modal').classList.remove('open');
  document.getElementById('cam-btn').classList.remove('capturing');
  if (_stream) { _stream.getTracks().forEach(function(t){t.stop();}); _stream = null; }
  document.getElementById('cam-video').srcObject = null;
  document.getElementById('cam-result').classList.remove('show');
}

// ESC closes any open modal
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') { closeVoice(); closeCamera(); }
});
</script>
